<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F3EE;color:#14181F;font-family:Vazirmatn,system-ui,sans-serif;direction:rtl;-webkit-font-smoothing:antialiased}
a{color:#0B2A4A;text-decoration:none}
a:hover{color:#12A47A}
@media (max-width:900px){
[style*="grid-template-columns"]{grid-template-columns:1fr!important}
h1{font-size:clamp(28px,7.4vw,40px)!important}
}
</style>
</helmet>
<div dir="rtl" style="max-width:1080px;margin:0 auto;padding:64px 22px 80px">
  <div style="font-size:12.5px;font-weight:700;letter-spacing:2px;color:#12A47A;margin-bottom:14px">پیشرو سرمایه — لندینگ پیج</div>
  <h1 style="margin:0 0 12px;font-size:40px;font-weight:800;color:#0B2A4A;letter-spacing:-1px">۱۰ نسخه طراحی</h1>
  <p style="margin:0 0 32px;font-size:16.5px;line-height:2.1;color:#5C6473;max-width:640px">پالت رنگی در همه‌ی نسخه‌ها یکسان است: سرمه‌ای <b dir="ltr">#0B2A4A</b> (اعتماد) + زمردی <b dir="ltr">#12A47A</b> (رشد) + نویترال‌های گرم. تفاوت نسخه‌ها در چیدمان، تایپوگرافی، سبک کارت‌ها و ساختار بصری است.</p>
  <div style="display:flex;gap:10px;margin-bottom:44px;flex-wrap:wrap">
    <div style="width:52px;height:52px;border-radius:12px;background:#0B2A4A"></div>
    <div style="width:52px;height:52px;border-radius:12px;background:#12A47A"></div>
    <div style="width:52px;height:52px;border-radius:12px;background:#F5F3EE;border:1px solid #DCD9D1"></div>
    <div style="width:52px;height:52px;border-radius:12px;background:#E6E3DB"></div>
    <div style="width:52px;height:52px;border-radius:12px;background:#6E7583"></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">
    <sc-for list="{{ versions }}" as="v" hint-placeholder-count="10">
      <a href="{{ v.href }}" style="display:block;background:#fff;border:1px solid #E4E0D7;border-radius:16px;padding:26px 28px">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px">
          <span style="font-size:12px;font-weight:800;color:#fff;background:#0B2A4A;padding:5px 10px;border-radius:6px">{{ v.n }}</span>
          <span style="font-size:19px;font-weight:800;color:#0B2A4A">{{ v.title }}</span>
        </div>
        <p style="margin:0;font-size:14.5px;line-height:2;color:#6E7583">{{ v.desc }}</p>
      </a>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const v = [
      ['۱','مینیمال کورپوریت','فضای سفید زیاد، خطوط نازک، تایپوگرافی آرام — پیش‌فرض قابل اتکا.','نسخه ۱ - مینیمال کورپوریت.dc.html'],
      ['۲','بنتو گرید مدرن','شبکه‌ی کاشی‌های رنگی با اندازه‌های متفاوت؛ آمار و ابزارها کنار هم.','نسخه ۲ - بنتو گرید مدرن.dc.html'],
      ['۳','ادیتوریال نامتقارن','ستون‌های نابرابر، تیتر بسیار درشت، خطوط جداکننده مجله‌ای.','نسخه ۳ - ادیتوریال نامتقارن.dc.html'],
      ['۴','دارک‌مود پریمیوم','زمینه‌ی سرمه‌ای تیره، درخشش زمردی، هیرو وسط‌چین.','نسخه ۴ - دارکمود پریمیوم.dc.html'],
      ['۵','گرم و انسانی','عکس‌محور، فرم‌های گرد، لحن صمیمی و کرم‌رنگ.','نسخه ۵ - گرم و انسانی.dc.html'],
      ['۶','داده‌محور','نوار قیمت لحظه‌ای، نمودار عملکرد و جدول مقایسه‌ی دو مسیر.','نسخه ۶ - دادهمحور.dc.html'],
      ['۷','کارتی مدولار','کارت‌های سایه‌دار شماره‌گذاری‌شده + نوار CTA چسبان پایین صفحه.','نسخه ۷ - کارتی مدولار.dc.html'],
      ['۸','روایت‌محور تک‌ستونی','یک ستون باریک، پنج فصل، خواندنی مثل یک مقاله.','نسخه ۸ - روایتمحور تکستونی.dc.html'],
      ['۹','گلس‌مورفیسم','سطوح شیشه‌ای مات روی هاله‌های رنگی محو.','نسخه ۹ - گلسمورفیسم.dc.html'],
      ['۱۰','کلاسیک بانکی رسمی','گوشه‌های تیز، نوار اطلاعیه، جدول دوره‌ها و لحن اداری.','نسخه ۱۰ - کلاسیک بانکی رسمی.dc.html']
    ];
    return { versions: v.map(x => ({ n: x[0], title: x[1], desc: x[2], href: encodeURI('./' + x[3]) })) };
  }
}
</script>
</body>
</html>
